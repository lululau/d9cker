[package]
name = "d9cker"
version = "0.1.1"
edition = "2021"
description = "A k9s-style terminal UI for managing Docker & Docker Swarm"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
bollard = { version = "0.21", features = ["ssh"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
futures = "0.3"
libc = "0.2"

[profile.release]
strip = true
lto = true

# UPSTREAM WORKAROUND — now blocked only on bollard regenerating its stubs.
#
# bollard's typed `Task` drops the swarm `/tasks` API's `NetworksAttachments`
# field, so per-task overlay IPs are unavailable. Root cause was moby's swagger:
# it never declared `NetworksAttachments` as a `Task` property (only showed it
# in examples), even though moby's own Go type `swarm.Task` has it — so the
# generated bollard-stubs omit it.
#
#   moby fix (swagger):   https://github.com/moby/moby/pull/53082  [MERGED]
#   released in moby:     docker-v29.7.0 and later
#   stub fork with field: loyalpartner/bollard @ task-networks-attachments
#
# Remaining blocker: bollard's codegen pins an older spec snapshot
# (codegen/swagger/pom.xml -> moby docker-v29.4.1/api/docs/v1.53.yaml), so the
# published bollard-stubs (1.53.1-rc.29.3.1) still lack the field. Once bollard
# bumps that inputSpec to docker-v29.7.0+ and releases, delete this block and
# bump bollard — we only read `task.networks_attachments[].addresses`, which the
# regenerated stub will provide under the same name, so no code change is needed.
#
# NOTE: a `[patch]` can't be published to crates.io and requires network to
# fetch the git dep at build time (fine for the binary / AUR build).
[patch.crates-io]
bollard-stubs = { git = "https://github.com/loyalpartner/bollard.git", branch = "task-networks-attachments" }
