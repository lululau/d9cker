[package]
name = "d9cker"
version = "0.1.0"
edition = "2021"
description = "A k9s-style terminal UI for managing Docker & Docker Swarm"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
bollard = { version = "0.21", features = ["ssh"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
futures = "0.3"

[profile.release]
strip = true
lto = true
