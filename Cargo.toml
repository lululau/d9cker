[package]
name = "d9cker"
version = "0.1.1"
edition = "2021"
description = "A k9s-style terminal UI for managing Docker & Docker Swarm"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
bollard = { version = "0.21", features = ["ssh"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
futures = "0.3"
libc = "0.2"

[profile.release]
strip = true
lto = true

# bollard's typed Task drops the swarm /tasks API's NetworksAttachments (moby's
# swagger only lists it in examples, so codegen skips it). This fork adds the
# field back so we can read per-task overlay IPs cluster-wide. See upstream PR.
[patch.crates-io]
bollard-stubs = { git = "https://github.com/loyalpartner/bollard.git", branch = "task-networks-attachments" }
