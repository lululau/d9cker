[package]
name = "d9cker"
version = "0.1.1"
edition = "2021"
description = "A k9s-style terminal UI for managing Docker & Docker Swarm"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
bollard = { version = "0.21", features = ["ssh"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
futures = "0.3"
libc = "0.2"

[profile.release]
strip = true
lto = true

# UPSTREAM WORKAROUND — remove once fixed upstream and a new bollard ships.
#
# bollard's typed `Task` drops the swarm `/tasks` API's `NetworksAttachments`
# field, so per-task overlay IPs are unavailable. Root cause is moby's swagger:
# it never declares `NetworksAttachments` as a `Task` property (only shows it in
# examples), even though moby's own Go type `swarm.Task` has it — so the
# generated bollard-stubs omit it.
#
#   moby fix (swagger):  https://github.com/moby/moby/pull/53082
#   stub fork with field: loyalpartner/bollard @ task-networks-attachments
#
# This patch points bollard-stubs at that fork. Once moby#53082 merges and a
# bollard release regenerates from the fixed spec, delete this block and bump
# bollard. NOTE: a `[patch]` can't be published to crates.io and requires
# network to fetch the git dep at build time (fine for the binary / AUR build).
[patch.crates-io]
bollard-stubs = { git = "https://github.com/loyalpartner/bollard.git", branch = "task-networks-attachments" }
